# Cloudflare Workers: static assets from dist/ + one Worker for the API + D1.
# `npm run deploy` builds dist/ and deploys both.
name = "polish-cases"
main = "worker.js"
compatibility_date = "2026-11-01"

[assets]
directory = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "polski-progress"
# Filled in by `wrangler d1 create polski-progress` — see README.
database_id = "1c3023c4-840b-4fd6-b72a-abebf27cdddb"
